name: Diagnose E4K API schema

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: e4k-api-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test diagnostic schema summarizer
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Inspect read-only API response shapes
        env:
          E4K_SERVER: ${{ vars.E4K_SERVER || 'EmpirefourkingdomsExGG2_3' }}
          E4K_API_BASE: ${{ vars.E4K_API_BASE || 'https://empire-api.fly.dev' }}
        run: python scripts/diagnose_api.py
